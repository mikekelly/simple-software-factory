[package]
name = "ssf"
version = "0.15.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mikekelly/simple-software-factory"
description = "Simple Software Factory: GitHub issues assigned to a bot become coding-agent workspaces in herdr"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6.0.0"
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "gzip", "http2", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"

[dev-dependencies]
# `start_paused` lets a delivery test spend the whole receipt timeout at once.
tokio = { version = "1.53.1", features = ["test-util"] }
