<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ssf terminal</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="terminal.css" />
  </head>
  <body>
    <header>
      <strong id="session"></strong>
      <span id="state">connecting…</span>
      <button id="type" type="button" aria-pressed="false" hidden>Type</button>
      <button id="reconnect" type="button" hidden>Reconnect</button>
      <button id="resume" type="button" hidden>Resume</button>
      <textarea id="keys" aria-label="Type into the pane" autocomplete="off"
        autocapitalize="off" spellcheck="false" tabindex="-1"></textarea>
    </header>
    <main id="scroller"><pre id="history"></pre><pre id="screen"></pre></main>
    <div id="xterm" hidden></div>
    <script type="module" src="terminal.js"></script>
  </body>
</html>
