# Release packages: on a vX.Y.Z tag, build the .deb, .rpm and bare x86_64
# binary (packaging/linux), the Arch .pkg.tar.zst (packaging/release) and,
# best effort, the aarch64 .deb, .rpm and bare binary, and attach them to a
# draft GitHub release of that tag, creating the draft if it does not exist
# yet. Existing assets are preserved so a package tested on the release
# target cannot be overwritten by a rebuild. Publishing is a separate, deliberate step after validation. On
# a manual run
# (workflow_dispatch) everything is built the same way and uploaded as
# workflow artifacts only, with the version from Cargo.toml; no release.
# Only plain vX.Y.Z tags: a pre-release tag such as v0.2.0-rc1 would make
# nfpm write 0.2.0~rc1 and makepkg refuse a pkgver with a hyphen.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
  # cut-release.yml calls this after pushing the tag: a tag pushed with the
  # workflow's own token starts no workflow run of its own.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and stage, vX.Y.Z"
        required: true
        type: string

# Read-only by default; only the release job, which uploads to the draft
# and attests the packages, gets more.
permissions:
  contents: read

env:
  NFPM_VERSION: 2.47.0
  # The release tag: the caller's input, else the pushed (or dispatched) tag,
  # else empty for a manual run on a branch.
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}

jobs:
  # .deb, .rpm and bare ssf/ssf-server x86_64 binaries from a static musl
  # build, via packaging/linux/build.sh.
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - name: Toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          curl -sSfL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb
      - name: Version
        # The tag without its v on a tag push; Cargo.toml's version on dispatch.
        run: |
          if [ -n "$TAG" ]; then echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"; fi
      - name: Build packages
        run: packaging/linux/build.sh
      - name: Test
        # Same profile as build.sh, so nothing is compiled twice.
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo test --locked --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: packaging/linux/dist/*
          if-no-files-found: error

  # The same for aarch64 (arm64 .deb and aarch64 .rpm, which arm64 VM guests
  # install, and the bare static client/server binaries), built natively on
  # GitHub's ARM runner. Best effort: a failure here never blocks the release.
  linux-aarch64-binary:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - name: Toolchain
        run: |
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          curl -sSfL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_arm64.deb"
          sudo dpkg -i /tmp/nfpm.deb
      - name: Version
        run: |
          if [ -n "$TAG" ]; then echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"; fi
      - name: Build packages
        env:
          # This runner is natively aarch64, so Ubuntu's musl-gcc compiles
          # bundled SQLite and links Rust for the same libc and architecture.
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          packaging/linux/build.sh
          file packaging/linux/dist/ssf-[0-9]*-linux-aarch64 packaging/linux/dist/ssf-server-*-linux-aarch64 | tee /tmp/aarch64-file-output
          test "$(grep -Fc 'ARM aarch64' /tmp/aarch64-file-output)" -eq 2
          test "$(grep -Fc 'statically linked' /tmp/aarch64-file-output)" -eq 2
          ls packaging/linux/dist/ssf_*_arm64.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-aarch64-binary
          path: packaging/linux/dist/*
          if-no-files-found: error

  # Arch package from packaging/release/PKGBUILD in an Arch container.
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Build dependencies
        # depends + makedepends + checkdepends of the PKGBUILD, minus herdr,
        # which is not in Arch's repositories (Omarchy's has it). makepkg
        # --nodeps only skips the dependency check on the build machine
        # ("Do not perform any dependency checks", makepkg(8)); the package's
        # own depends, herdr included, are written to its metadata as usual.
        run: |
          pacman -Syu --noconfirm rust jq systemd github-cli git openssh
          useradd -m builder
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG || github.sha }}
          # The development PKGBUILD's pkgver counts the commits on HEAD.
          fetch-depth: 0
      - name: makepkg
        # On a tag the checked-in release PKGBUILD downloads the immutable
        # source commit selected for the release and verifies its checksum.
        # The tag may point at a later metadata-only commit containing that
        # checksum, so do not replace the source with an archive of HEAD.
        # On dispatch there is no tag tarball: the development PKGBUILD in
        # packaging/, which sources the release one and tars the working tree,
        # builds instead (version X.Y.Z.rN.gSHA).
        run: |
          chown -R builder: .
          git config --global --add safe.directory "$PWD"
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            mkdir -p /tmp/arch && cp -L packaging/release/PKGBUILD packaging/release/ssf.install /tmp/arch/
            PKGVER=$(sed -n 's/^pkgver=//p' /tmp/arch/PKGBUILD)
            if [ "$PKGVER" != "$VERSION" ]; then
              echo "::error::tag version $VERSION does not match release PKGBUILD pkgver $PKGVER"
              exit 1
            fi
            chown -R builder: /tmp/arch
            runuser -u builder -- sh -c 'cd /tmp/arch && makepkg -f --nodeps'
            mkdir -p dist && mv /tmp/arch/*.pkg.tar.zst dist/
          else
            runuser -u builder -- sh -c 'cd packaging && makepkg -f --nodeps'
            mkdir -p dist && mv packaging/*.pkg.tar.zst dist/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  # One job stages a draft release after the builds: no race on
  # `gh release create`, and a draft is only made once every package exists.
  # It never publishes the draft or changes a published release, and never
  # replaces an existing asset. The condition spells
  # that out: always() so a failed aarch64 job does not skip this one, then
  # the two package jobs must have succeeded (the aarch64 files are uploaded
  # when its job succeeded, skipped otherwise). Tag pushes and calls from
  # cut-release.yml only: a manual run on a tag ref builds and uploads
  # artifacts but stages nothing.
  release:
    if: always() && ((github.event_name == 'push' && github.ref_type == 'tag') || inputs.tag != '') && needs.linux-packages.result == 'success' && needs.arch-package.result == 'success'
    needs: [linux-packages, arch-package, linux-aarch64-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      # SLSA build provenance for the packages this run built, verifiable
      # with `gh attestation verify FILE -R OWNER/REPO`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create a draft release if missing, add new packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --generate-notes --verify-tag

          is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$is_draft" != true ]; then
            echo "Release is already published; leaving it unchanged"
            exit 0
          fi

          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in dist/*; do
            name=${asset##*/}
            if grep -Fqx -- "$name" <<<"$existing"; then
              echo "Preserving existing release asset: $name"
            else
              gh release upload "$TAG" "$asset"
            fi
          done

          # SHA256SUMS over every asset now on the draft, preserved ones
          # included; guests verify their ssf download against it.
          mkdir -p /tmp/assets
          gh release download "$TAG" -D /tmp/assets --clobber
          rm -f /tmp/assets/SHA256SUMS
          (cd /tmp/assets && sha256sum -- *) > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
