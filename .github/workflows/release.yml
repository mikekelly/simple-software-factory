# Release packages: on a vX.Y.Z tag, build the .deb, .rpm and bare x86_64
# binary (packaging/linux), the Arch .pkg.tar.zst (packaging/release) and,
# best effort, a bare aarch64 binary, and attach them to the GitHub release
# of that tag, creating it if it does not exist yet. On a manual run
# (workflow_dispatch) everything is built the same way and uploaded as
# workflow artifacts only, with the version from Cargo.toml; no release.
name: release

on:
  push:
    tags: ['v*']
    branches: ['bot/issue-127-**']  # TEMPORARY: test run on the issue branch, removed before merge
  workflow_dispatch:

permissions:
  contents: write

env:
  NFPM_VERSION: 2.47.0

jobs:
  # .deb, .rpm and the bare binary ssf-X.Y.Z-linux-x86_64 from a static
  # musl build, via packaging/linux/build.sh.
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y musl-tools
          curl -sSfL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb
      - name: Version
        # The tag without its v on a tag push; Cargo.toml's version on dispatch.
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
      - name: Build packages
        run: packaging/linux/build.sh
      - name: Test
        # Same profile as build.sh, so nothing is compiled twice.
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo test --locked --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packaging/linux/dist/*
          if-no-files-found: error

  # Bare static aarch64 binary, ssf-X.Y.Z-linux-aarch64, cross-compiled; no
  # aarch64 packages. Best effort: a failure here never blocks the release.
  linux-aarch64-binary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        env:
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1); fi
          cargo build --locked --release --target aarch64-unknown-linux-musl
          mkdir -p dist && install -m755 target/aarch64-unknown-linux-musl/release/ssf "dist/ssf-$VERSION-linux-aarch64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-binary
          path: dist/*
          if-no-files-found: error

  # Arch package from packaging/release/PKGBUILD in an Arch container.
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Build dependencies
        # depends + makedepends + checkdepends of the PKGBUILD, minus herdr,
        # which is not in Arch's repositories (Omarchy's has it). makepkg
        # --nodeps only skips the dependency check on the build machine
        # ("Do not perform any dependency checks", makepkg(8)); the package's
        # own depends, herdr included, are written to its metadata as usual.
        run: |
          pacman -Syu --noconfirm rust jq systemd github-cli git
          useradd -m builder
      - uses: actions/checkout@v4
        with:
          # The development PKGBUILD's pkgver counts the commits on HEAD.
          fetch-depth: 0
      - name: makepkg
        # On a tag the release PKGBUILD builds the tag tarball. GitHub's
        # archive is `git archive` with a simple-software-factory-X.Y.Z/
        # prefix, so the same tarball is made here from the checkout (the
        # repository may be private; makepkg uses a source file that is
        # already in the directory instead of downloading it), and
        # --skipchecksums covers the sha256 the PKGBUILD has for the download.
        # On dispatch there is no tag tarball: the development PKGBUILD in
        # packaging/, which sources the release one and tars the working tree,
        # builds instead (version X.Y.Z.rN.gSHA).
        run: |
          chown -R builder: .
          git config --global --add safe.directory "$PWD"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            mkdir -p /tmp/arch && cp -L packaging/release/PKGBUILD packaging/release/ssf.install /tmp/arch/
            sed -i "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" /tmp/arch/PKGBUILD
            git archive --format=tar.gz --prefix="simple-software-factory-$VERSION/" \
              -o "/tmp/arch/ssf-$VERSION.tar.gz" HEAD
            chown -R builder: /tmp/arch
            runuser -u builder -- sh -c 'cd /tmp/arch && makepkg -f --skipchecksums --nodeps'
            mkdir -p dist && mv /tmp/arch/*.pkg.tar.zst dist/
          else
            runuser -u builder -- sh -c 'cd packaging && makepkg -f --nodeps'
            mkdir -p dist && mv packaging/*.pkg.tar.zst dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  # One job publishes, after the builds: no race on `gh release create`, and
  # a release is only made once every package exists (the aarch64 binary is
  # uploaded when its job succeeded, skipped otherwise). Tags only.
  release:
    if: github.ref_type == 'tag'
    needs: [linux-packages, arch-package, linux-aarch64-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release if missing, upload the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
