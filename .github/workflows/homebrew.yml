# When a vX.Y.Z GitHub release is published, render packaging/homebrew/ssf.rb
# with the tag tarball's url and sha256, build a bottle of it on each macOS
# runner and attach the bottles to the release, add their `bottle do` block
# (packaging/homebrew/bottle.rb) and push the formula to the Homebrew tap as
# Formula/ssf.rb. A bottle job that fails leaves only its bottle out: Macs
# without a bottle build from source, as every Mac did before.
# packaging/homebrew/README.md says how the tap and the token are set up.
# Waiting for publication keeps the tap from pointing at a draft whose
# packages have not completed validation. Manual dispatch remains available.
name: Homebrew formula

on:
  release:
    types: [published]
  # cut-release.yml calls this after publishing: a release published with
  # the workflow's own token starts no workflow run of its own.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, vX.Y.Z"
        required: true
        type: string
      dry_run:
        description: "Build bottles, but upload nothing and do not push the tap"
        required: false
        type: boolean
        default: false

env:
  # The tap repository; the formula is pushed there as Formula/ssf.rb.
  HOMEBREW_TAP: mikekelly/homebrew-tap

# One tap push at a time. Two tags close together (a v0.2.0 and the v0.2.1
# that fixes it minutes later) would otherwise render, clone, commit and
# push Formula/ssf.rb in parallel, and the loser of the race either force
# -pushes an older formula over a newer one or fails on a non-fast-forward.
# The group is a fixed name, not the ref: keying it on the ref would put
# every tag in a group of its own and let exactly the case this guards
# against run. Nor is it `github.workflow`: called from cut-release.yml that
# is the caller's name, the group the calling run already holds, and GitHub
# cancels the waiting job. `cancel-in-progress: false` so the earlier tag
# finishes its push and the later one goes second, over it.
concurrency:
  group: homebrew-formula
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  formula:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # The same tag shape as release.yml: a dispatch or published
          # pre-release tag (v0.2.0-rc1) would otherwise render a formula for
          # a release release.yml never built packages for.
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag; release.yml builds packages for those only"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Download the tag tarball and render the formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
          # Unauthenticated on purpose: Homebrew downloads the same url the
          # same way, so this also proves the repository is public.
          if ! curl -fsSL --retry 3 -o tarball.tar.gz "$url"; then
            echo "::error::cannot download $url without a login; the repository has to be public for the formula to work"
            exit 1
          fi
          sha=$(sha256sum tarball.tar.gz | cut -d' ' -f1)
          echo "v${VERSION}: $url sha256 $sha"
          mkdir -p rendered
          packaging/homebrew/render.sh "$VERSION" "$sha" "$GITHUB_REPOSITORY" > rendered/ssf.rb
          grep -Fq "  url \"$url\"" rendered/ssf.rb
          grep -Fq "  sha256 \"$sha\"" rendered/ssf.rb
          ruby -c rendered/ssf.rb
          cat rendered/ssf.rb

      - name: Upload the rendered formula
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ssf.rb
          path: rendered/ssf.rb

  bottle:
    needs: [formula]
    strategy:
      fail-fast: false
      matrix:
        # The oldest macOS of each architecture: Homebrew pours a bottle
        # built for an older macOS on newer ones, so these two cover every
        # Mac the formula supports; macos-15 is only for when macos-14
        # runners retire.
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ssf.rb

      - name: Build the bottle
        env:
          TAG: ${{ needs.formula.outputs.tag }}
        run: |
          set -euo pipefail
          # brew builds bottles only of tapped formulae: a throwaway local tap.
          brew tap-new --no-git local/ssf
          cp ssf.rb "$(brew --repository local/ssf)/Formula/ssf.rb"
          brew install --build-bottle local/ssf/ssf
          brew test local/ssf/ssf
          brew bottle --json \
            --root-url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            local/ssf/ssf
          ls -l ./*.bottle.*

      - name: Attach the bottle to the release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.formula.outputs.tag }}
        run: |
          set -euo pipefail
          # brew writes ssf--X.Y.Z.TAG.bottle.tar.gz and downloads the name in
          # the JSON's "filename", ssf-X.Y.Z.TAG.bottle.tar.gz.
          for json in ./*.bottle.json; do
            jq -r '.[].bottle.tags[] | [.local_filename, .filename] | @tsv' "$json" |
              while IFS=$'\t' read -r local remote; do
                mv "$local" "$remote"
                gh release upload "$TAG" "$remote" --clobber
              done
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bottle-${{ matrix.runner }}
          path: ./*.bottle.json

  publish:
    needs: [formula, bottle]
    # Also when a bottle job failed: the formula then carries the bottles
    # that were built and the rest of Macs build from source.
    if: always() && needs.formula.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # The workflow's own commit, not the tag: bottle.rb is a release tool,
      # and a tag cut before it existed can be bottled by a later one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Add the bottle block
        env:
          TAG: ${{ needs.formula.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p rendered
          shopt -s nullglob
          packaging/homebrew/bottle.rb artifacts/ssf.rb/ssf.rb \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            artifacts/bottle-*/*.bottle.json > rendered/ssf.rb
          ruby -c rendered/ssf.rb
          cat rendered/ssf.rb

      - name: Push the formula to the tap
        if: inputs.dry_run != true
        env:
          VERSION: ${{ needs.formula.outputs.version }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set; the formula was rendered but was not published to ${HOMEBREW_TAP}"
            exit 1
          fi
          # A write deploy key on the tap: scoped to that one repository and,
          # unlike a personal access token, it does not expire.
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 "git@github.com:${HOMEBREW_TAP}.git" tap
          cd tap
          # A tap repository that has no commits yet gets its first one here.
          git rev-parse --verify HEAD >/dev/null 2>&1 || git checkout -b main
          mkdir -p Formula
          cp ../rendered/ssf.rb Formula/ssf.rb
          git add Formula/ssf.rb
          if git diff --cached --quiet; then
            echo "${HOMEBREW_TAP} already has ssf v${VERSION}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "ssf v${VERSION}" \
                     -m "Rendered from packaging/homebrew/ssf.rb at ${GITHUB_REPOSITORY}@v${VERSION} by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin HEAD
