<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSF agents</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="vendor/dockview/dockview.css">
  <link rel="stylesheet" href="xterm.css">
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
  <header class="masthead">
    <div>
      <h1>Active agents</h1>
      <p class="eyebrow">Simple Software Factory</p>
    </div>
    <div class="refresh-block">
      <span id="refresh-status" aria-live="polite">Loading sessions…</span>
      <span id="build" class="build"></span>
      <a class="download" href="chrome-extension.zip" download>Chrome extension</a>
      <button id="refresh" type="button">Refresh</button>
      <div class="theme-switch" role="group" aria-label="Appearance">
        <button type="button" value="system" aria-pressed="true">System</button>
        <button type="button" value="light" aria-pressed="false">Light</button>
        <button type="button" value="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </header>
  <div id="dock" class="dock"></div>
  <main id="agents">
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="cards" class="cards" aria-label="Active SSF agents" aria-busy="true"></section>
    <section id="parked" class="monitored" hidden>
      <h2>Parked sessions</h2>
      <ul></ul>
    </section>
    <section id="monitored" class="monitored" hidden>
      <h2>Monitored without an agent</h2>
      <ul></ul>
    </section>
    <section id="empty" class="empty" hidden>
      <div class="empty-mark" aria-hidden="true">✓</div>
      <h2>No active agents</h2>
      <p>No agent sessions are currently executing.</p>
    </section>
  </main>
  <template id="card-template">
    <article class="card">
      <div class="card-top">
        <span class="state"><span class="state-dot" aria-hidden="true"></span><span class="state-text"></span></span>
        <span class="harness"></span>
      </div>
      <h2 class="issue-heading"><a class="issue-link" target="_blank" rel="noopener noreferrer"></a></h2>
      <p class="issue-title"></p>
      <a class="terminal-link" role="button" target="_blank" rel="noopener" hidden><svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM7.25 8a.749.749 0 0 1-.22.53l-2.25 2.25a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734L5.44 8 3.72 6.28a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l2.25 2.25c.141.14.22.331.22.53Zm1.5 1.5h3a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1 0-1.5Z"/></svg>Open terminal</a>
      <dl class="facts">
        <div><dt>Last active</dt><dd class="activity"></dd></div>
      </dl>
      <div class="related owns" hidden>
        <h3>Owns</h3>
        <ul></ul>
      </div>
      <div class="related following" hidden>
        <h3>Following</h3>
        <ul></ul>
      </div>
    </article>
  </template>
  <template id="related-template">
    <li><svg class="icon kind" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" role="img"></svg><a class="ref" target="_blank" rel="noopener noreferrer"></a><span class="title"></span><span class="level"></span></li>
  </template>
  <script src="vendor/dockview/dockview-core.min.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
