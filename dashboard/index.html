<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSF agents</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="vendor/dockview/dockview.css">
  <link rel="stylesheet" href="xterm.css">
  <link rel="stylesheet" href="terminal.css">
</head>
<body>
  <header class="masthead">
    <div>
      <p class="eyebrow">Simple Software Factory</p>
      <h1>Active agents</h1>
    </div>
    <div class="refresh-block" aria-live="polite">
      <span id="refresh-status">Loading sessions…</span>
      <span id="build" class="build"></span>
      <button id="refresh" type="button">Refresh</button>
      <a class="download" href="chrome-extension.zip" download>Download Chrome extension</a>
    </div>
  </header>
  <div id="dock" class="dock dockview-theme-ssf"></div>
  <main id="agents">
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="cards" class="cards" aria-label="Active SSF agents" aria-busy="true"></section>
    <section id="monitored" class="monitored" hidden>
      <h2>Monitored without an agent</h2>
      <ul></ul>
    </section>
    <section id="empty" class="empty" hidden>
      <div class="empty-mark" aria-hidden="true">✓</div>
      <h2>No active agents</h2>
      <p>SSF has no assigned sessions to show right now.</p>
    </section>
  </main>
  <template id="card-template">
    <article class="card">
      <div class="card-top">
        <span class="state"><span class="state-dot" aria-hidden="true"></span><span class="state-text"></span></span>
        <span class="harness"></span>
      </div>
      <h2 class="issue-title"></h2>
      <a class="issue-link" target="_blank" rel="noopener noreferrer"></a>
      <a class="terminal-link" target="_blank" rel="noopener" hidden>Open terminal</a>
      <dl class="facts">
        <div><dt>Last active</dt><dd class="activity"></dd></div>
        <div><dt>Latest message or summary</dt><dd class="message"></dd></div>
      </dl>
      <div class="additional" hidden>
        <h3>Additional assigned issues</h3>
        <ul></ul>
      </div>
    </article>
  </template>
  <script src="vendor/dockview/dockview-core.min.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
