# Simple Software Factory configuration (~/.config/ssf/config.toml); every key
# is explained in docs/configuration.md.
# Most of this is written for you by `ssf repo add`, the bar widget, or
# `ssf config set`; the token is read from gh's keyring, or from
# ~/.config/ssf/token (0600) after `ssf auth login --token`, never from here.

[github]
# api_url = "https://api.github.com"      # GitHub Enterprise: https://ghe.example.com/api/v3
# Written by `ssf auth login --user <bot>`:
# login = "acme-bot"
# email = "12345+acme-bot@users.noreply.github.com"
# ssh_key_path = "~/.config/ssf/keys/acme-bot_ed25519"   # enrolled for SSH pushes and commit signing
# ssh_key_id = 0
# signing_key_id = 0

# Who the agents' commits are by, when not the bot: gh, the API and the
# daemon stay the bot; only the commit author/committer (and, if you say
# so, the signature and the push) become this person. A [[repo]] overrides
# any key in its own [repo.git]. See docs/identity-and-bylines.md.
[git]
# name = "Ann Person"                          # author and committer; set with email or not at all
# email = "ann@example.com"                    # an address verified on Ann's GitHub account, or her id+login@users.noreply.github.com
# signing_key = "~/.ssh/id_ed25519"            # SSH key to sign with, or false; default: the bot's key for the bot, unsigned for a person
# credential = "bot"                           # who pushes over HTTPS: bot | token:<gh login> | file:<token file> | a git credential helper string

# What runs the agents: "herdr" (default) or "orca". A [[repo]] can pick
# its own with `driver = "..."`. The default was Orca until 2026-09-06; a
# file that leaves this unset runs its repositories in herdr, and
# `ssf config show` / `ssf doctor` say so. Pin it to keep Orca.
# driver = "herdr"

[orca]
# command = "/usr/lib/orca-ide/bin/orca-ide"   # the Orca CLI (not /usr/bin/orca-ide, which launches the app)
# host = "local"
# projects_dir = "~/orca/projects"             # where repos are cloned when Orca has no project yet
# setup_timeout_secs = 900
# tui_idle_timeout_ms = 90000

[herdr]
# command = "herdr"                            # the herdr CLI; a herdr session must be running
# projects_dir = "~/ssf/projects"              # ssf clones repos here; worktrees go in <name>.worktrees/ next to the clone
# tui_idle_timeout_ms = 90000                  # how long a freshly started agent gets to show up in its pane


# The whole factory (daemon, herdr, sessions) inside a Firecracker microVM
# instead of on this machine; see `ssf vm --help` and docs/vm.md. With
# `enabled = true`, `ssf run` starts and watches the VM, and `ssf status`,
# `tell`, `peers`, `sub`, `release`, `purge` and `doctor` run inside it.
[vm]
# enabled = false
# name = "default"                             # disks live in <dir>/<name>/
# dir = "~/.local/share/ssf/vm"                # image, kernel, firecracker, gvproxy, VMs
# vcpus = 2
# mem_mib = 4096
# data_gib = 20                                # persistent data disk: state, clones, worktrees (sparse)
# root_gib = 8                                 # size of the root image `ssf vm build` makes
# ssh_port = 2222                              # the guest's sshd on 127.0.0.1
# files = ["~/.claude/.credentials.json"]      # host files copied into the guest at every start; `src:dest` to place them
#                                              # (a copied login is the same session as yours: a guest logout signs you out here too; prefer `ssf vm login`)
# firecracker = "..."                          # binaries and images, when not the downloaded ones under `dir`
# gvproxy = "..."
# kernel = "..."
# rootfs = "..."

[daemon]
# poll_interval_secs = 10
# include_own_events = false                   # deliver the bot's own commits/cross-references and each session's posts back to it
# ignored_events = ["mentioned", "subscribed", "unsubscribed"]
# max_body_chars = 8000
# instructions = """
# House rules appended to every initial prompt.
# """
# cleanup_on_close = true                      # no longer used: item workspaces are never removed on close (the agent runs `ssf release`; `ssf purge` sweeps the rest)
# cleanup_grace_secs = 900                     # how long a reviewer session gets to finish before its read-only workspace is removed anyway
# review_label = "review"                      # label that asks for a review of a session's own PR (GitHub refuses review requests from the author); "" disables
# resume_on_start = true                       # after a reboot, start again the sessions whose terminals are gone (running ones are left alone)
# startup_orca_wait_secs = 120                 # wait this long for the driver (herdr or Orca) at daemon start (every 10 s) before the first poll
# Who may drive the factory: only these GitHub logins' assignments, mentions,
# review requests, labels and comments count (case-insensitive; the bot
# itself always does). Unset: each repository's collaborators with push
# access, fetched by the daemon. ["*"] means anyone on GitHub and is refused
# unless accepted_anyone_risk = true stands next to it (written by
# `ssf config set daemon.allowed_users '["*"]' --accept-anyone-risk`).
# allowed_users = ["mikekelly", "github-actions[bot]"]
# accepted_anyone_risk = false

# One [[repo]] per watched repository.
[[repo]]
name = "owner/name"
harness = "claude"                             # agent id: see `ssf agents`
# driver = "herdr"                             # orca | herdr (default: the top-level `driver`)
# command = "claude --permission-mode acceptEdits"    # how the agent is started; default: its permission-free command (`ssf agents --json`), run via `ssf launch`
# model = "opus"                               # Orca model id, or provider/model for pi/omp/opencode (see `ssf models <agent>`)
# effort = "high"                              # effort/thinking level (claude: low|medium|high|xhigh|max; codex: minimal..ultra; pi/omp: off..max)
# clone_url = "git@github.com:owner/name.git"  # default: https://github.com/owner/name.git
# path = "~/code/name"                         # use an existing checkout instead of cloning
# base_branch = "origin/main"
# instructions = "Run `make test` before opening a PR."
# prompt_file = "SSF.md"                       # file appended to the initial prompt (see SSF.example.md); relative to the worktree unless absolute
# allowed_users = ["mikekelly"]                # who may drive this repository, replacing daemon.allowed_users ([] is nobody but the bot; ["*"] needs accepted_anyone_risk = true here)
# [repo.git]                                   # this repository's commit identity, each key over the [git] table above
# name = "Ann Person"
# email = "ann@example.com"
# signing_key = "~/.ssh/id_ed25519"
# credential = "token:ann"                     # push as @ann with the token gh holds for her (needs an HTTPS clone_url)
