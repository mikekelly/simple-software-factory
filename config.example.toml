# Simple Software Factory configuration (~/.config/ssf/config.toml).
# Every key is explained in docs/configuration.md (`ssf skill config`).
# Most of it is written for you by `ssf repo add`, `ssf repo set` and
# `ssf config set`; the dashboards only show state.
# The GitHub token is never here: it comes from gh's keyring, or from
# ~/.config/ssf/token (0600) after `ssf auth login --token`.
# Named routes to factories are separate, in ~/.config/ssf/servers.toml;
# create them with `ssf server add`, not in this factory-owned file.
# In VM mode [vm] and [dashboard] belong to the host and everything else to
# the guest, where the paths below are guest paths.

[github]
# api_url = "https://api.github.com"      # GitHub Enterprise: https://ghe.example.com/api/v3
# Written by `ssf auth login --user <bot>`:
# login = "bot-login"
# email = "12345+bot-login@users.noreply.github.com"
# ssh_key_path = "~/.config/ssf/keys/bot-login_ed25519"  # enrolled for SSH pushes and commit signing
# ssh_key_id = 0
# signing_key_id = 0
# Accept pending repository invitations sent by these GitHub users
# (case-insensitive). Grants the bot access only: it adds no [[repo]],
# selects no server and enables no service.
# auto_accept_invitations_from = ["alice", "acme-admin"]

# Who the agents' commits are by, when not the bot: gh, the API and the
# daemon stay the bot; only the commit author/committer (and, if you say
# so, the signature and the push) become this person. A [[repo]] overrides
# any key in its own [repo.git]. See docs/identity-and-bylines.md.
[git]
# name = "Ann Person"                          # author and committer; set with email or not at all
# email = "ann@example.com"                    # an address verified on Ann's GitHub account, or her id+login@users.noreply.github.com
# signing_key = "~/.ssh/id_ed25519"            # SSH key to sign with, or false; default: the bot's key for the bot, unsigned for a person
# credential = "bot"                           # who pushes over HTTPS: bot | token:<gh login> | file:<token file> | a git credential helper string

# SSF is built on herdr, which runs the agent workspaces and terminals.
# driver = "herdr"

# Context a session's harness may fill before it compacts its own history, in
# tokens, for every repository that does not set its own. Conservative, because
# an unattended session that compacts only at the model's own limit pays for its
# whole history on every turn. Used by claude, codex and omp; the others ignore
# it. 0 leaves each harness's own default alone. See docs/harnesses.md.
# auto_compaction_tokens = 300000

[herdr]
# command = "herdr"                            # the herdr CLI; a herdr session must be running. A bare name not on PATH
#                                              # is also looked for at ~/.local/bin/<name>, where herdr's installer puts it
# projects_dir = "~/ssf/projects"              # ssf clones repos here; worktrees go in <name>.worktrees/ next to the clone
# tui_idle_timeout_ms = 90000                  # how long a freshly started agent gets to show up in its pane

# The whole factory (daemon, herdr, sessions) inside a VM instead of on this
# machine: a Firecracker microVM on Linux, a lima instance on macOS; see
# `ssf vm --help` and docs/vm.md. With `enabled = true`, `ssf-server` starts and
# watches the VM, and the daemon-facing client commands run inside it.
# Leave the sizes unset: `ssf vm build` measures the host and writes them.
[vm]
# enabled = false
# name = "default"                             # disks live in <dir>/<name>/ (lima: instance ssf-<name>, disk ssf-<name>; at most 7 characters under lima)
#                                              # must name a directory under `dir`: not empty, not absolute, no `..`; nested names like "a/b" are fine
# dir = "~/.local/share/ssf/vm"                # image, kernel, firecracker, gvproxy, VMs (lima: the template, share and ssh key per VM)
# backend = "firecracker"                      # firecracker | lima; unset = firecracker on Linux, lima on macOS; `ssf vm build` writes it
# vcpus =                                      # unset = the host's CPUs minus one, at least 2
# mem_mib =                                    # unset = half the host's RAM, at least 4096
# data_gib =                                   # persistent data disk (state, clones, worktrees); sparse, so a cap, not a reservation.
#                                              # unset = half the free space where the disk will live, at least 20; `ssf vm build` prints
#                                              # the path it measured, and `ssf vm grow` enlarges the disk later
# root_gib = 8                                 # size of the root image `ssf vm build` makes (lima: the instance's root disk, at least 20)
# ssh_port = 2222                              # the guest's sshd on 127.0.0.1
# files = ["~/.claude/.credentials.json"]      # host files copied into the guest at every start; `src:dest` to place them
#                                              # (a copied login is the same session as yours: a guest logout signs you out here too; prefer `ssf vm login`)
# firecracker = "..."                          # binaries and images, when not the downloaded ones under `dir`
# gvproxy = "..."
# kernel = "..."
# rootfs = "..."
# limactl = "limactl"                          # lima: the limactl binary, when not the one on PATH
# image = "https://.../image.qcow2"            # lima: a cloud-init image (URL or path) instead of the default for the guest's architecture
# vm_type = "vz"                               # lima: vz | qemu; unset = lima's default
# guest_binary = "~/dl/ssf-linux"              # Linux ssf client for the guest; matching ssf-server binary must be beside it
# herdr = "~/dl/herdr-linux"                   # lima: a Linux herdr binary for the guest; unset = the host's own on Linux, else the guest downloads herdr's release

[daemon]
# One `ssf-server` or `ssf-server --once` owns this state directory at a time. A
# one-shot run refuses while another engine owns it; wait for that run to finish.
# poll_interval_secs = 10
# conflict_check_interval_secs = 300           # fetch the base once per active repository at this interval and notify sessions only of committed-branch merge conflicts; 0 disables
# include_own_events = false                   # deliver the bot's own commits/cross-references and each session's posts back to it
# ignored_events = ["mentioned", "subscribed", "unsubscribed"]
# max_body_chars = 8000
# first_prompt_max_events = 50                 # events a session's first message carries, newest first; 0 is no limit, and what is left out is never delivered later
# first_prompt_max_chars = 32000               # character budget for those events together, spent newest first so the newest is always included; 0 is no limit
# instructions = """
# House rules appended to every initial prompt.
# """
# resume_on_start = true                       # after a reboot, start again the sessions whose terminals are gone (running ones are left alone)
# startup_driver_wait_secs = 120               # wait this long for herdr at daemon start (every 10 s) before the first poll
# Who may drive the factory: only these GitHub logins' assignments, mentions,
# review requests, labels and comments count (case-insensitive; the bot
# itself always does). Unset: each repository's collaborators with push
# access, fetched by the daemon. ["*"] means anyone on GitHub and is refused
# unless accepted_anyone_risk = true stands next to it (written by
# `ssf config set daemon.allowed_users '["*"]' --accept-anyone-risk`).
# allowed_users = ["alice", "bob", "github-actions[bot]"]
# accepted_anyone_risk = false
# event_comments = true                        # post the daemon's events (session attached, resumed, blocked/unblocked, gave up, workspace released) on the item as fenced ssf blocks; false posts nothing
# item_pane_input = false                     # let the web pane mirror type into item sessions' panes; off, an item's agent is spoken to by commenting on the item (scratch sessions always take typing)
# scratch_release_grace_hours = 24            # how long a killed scratch session is kept before the factory forgets it (out of the list, no longer resumable); 0 keeps them for ever
# A person can release a retired session pinned by open follow-ups with
# `ssf release --as owner/repo#N --force`; this also skips worktree safety checks.

# One [[repo]] per watched repository.
[[repo]]
name = "owner/name"
# github_id and aliases are maintained by ssf so GitHub renames and transfers reconnect automatically.
harness = "claude"                             # agent id: see `ssf agents` and docs/harnesses.md
# driver = "herdr"                             # default: the top-level `driver`
# command = "claude --permission-mode acceptEdits"    # how the agent is started; default: its permission-free command (`ssf agents --json`), run via `ssf launch`
#                                                     # a custom command replaces the whole default: see docs/harnesses.md for what it must keep
# Choose model and effort with the operator before watching this repository.
# Required by repo add/set when the harness supports them.
model = "opus"                               # the session's own model, not its subagents'; provider/model for pi/omp/opencode, auto or a model name for copilot, none for crush. `ssf models <agent>` lists what the installed agent offers; choosing one: docs/repositories.md
effort = "high"                              # effort/thinking level; `ssf agents --json` lists what each harness accepts
# auto_compaction_tokens = 300000              # context this repository's sessions may fill before the harness compacts its own history; overrides the top-level key (0: the harness's own default; claude requires 100000-1000000; claude/codex/omp only)
# clone_url = "git@github.com:owner/name.git"  # default: https://github.com/owner/name.git
# path = "~/code/name"                         # use an existing checkout instead of cloning
# base_branch = "origin/main"                 # branch new worktrees start from (default: origin's default branch); `ssf doctor` counts a worktree's commits beyond it
# instructions = "Run `make test` before opening a PR."
# Optional ~/.ssf/SSF.md and ~/.ssf/SSF.<harness>.md apply machine-wide before repository guidance.
# Optional SSF.<harness>.md at the worktree root adds harness-specific main-session guidance.
# prompt_file = "SSF.md"                       # SSF agent guidance appended to the main session's initial prompt (see SSF.example.md); relative to the worktree unless absolute
# allowed_users = ["alice"]                    # who may drive this repository, replacing daemon.allowed_users ([] is nobody but the bot; ["*"] needs accepted_anyone_risk = true here)
# event_comments = false                       # this repository's items get no ssf event posts (default: daemon.event_comments)
# item_pane_input = true                      # this repository's item panes take typing from the web pane mirror (default: daemon.item_pane_input)
# conflict_check_interval_secs = 0             # disable conflict notices for this repository (default: daemon.conflict_check_interval_secs)
# first_prompt_max_events = 0                  # no limit: this repository's first messages carry the whole timeline again (default: daemon.first_prompt_max_events)
# first_prompt_max_chars = 0                   # likewise for the character budget (default: daemon.first_prompt_max_chars)
# [repo.git]                                   # this repository's commit identity, each key over the [git] table above
# name = "Ann Person"
# email = "ann@example.com"
# signing_key = "~/.ssh/id_ed25519"
# credential = "token:ann"                     # push as @ann with the token gh holds for her (needs an HTTPS clone_url)

# Session gh shim: explicit bodies are stamped; large bodies use anonymous
# file transport. Both wrappers (the gh shim and the git shim beside it) run
# the real programs with the session's own gh token, ssh command and git
# configuration. See docs/identity-and-bylines.md; no configuration is needed.

# Optional server browser dashboard. Restart ssf-server after changes.
# In VM mode this section belongs to the host, not the guest.
# The URL's secret is generated once and kept in the factory's state directory
# (dashboard-token, 0600), so a restart serves the same URL a client saved.
# Only loopback or a Tailscale address (100.64.0.0/10, fd7a:115c:a1e0::/48) is
# accepted; use an authenticated TLS reverse proxy for any other remote access.
[dashboard]
# enabled = false
# bind = "127.0.0.1"
# port = 8787
