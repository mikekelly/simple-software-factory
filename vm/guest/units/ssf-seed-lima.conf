# Drop-in for ssf-seed.service under lima (installed by provision.sh as
# /etc/systemd/system/ssf-seed.service.d/lima.conf). Lima mounts the data
# disk from cloud-init's final stage (its boot.sh), which on this image
# runs after sshd is up, so the unit must not stand before sshd, and it
# waits for that stage instead of polling for the mount.
[Unit]
After=cloud-final.service
Before=
Before=herdr-server.service ssf.service
