# Drop-in for ssf-seed.service under lima (provision.sh installs the files
# in this directory as /etc/systemd/system/<unit>.d/lima.conf). Lima mounts
# the data disk from cloud-init's final stage (its boot.sh, a per-boot
# script), so the seed waits for that stage rather than for a device.
# cloud-final.service is itself ordered after multi-user.target, which is
# why every unit here has DefaultDependencies=no (and why the seed unit
# stands before nothing multi-user.target waits for, sshd included): with
# that, multi-user.target does not wait for them, and there is no ordering
# cycle. A dependency list cannot be emptied from a drop-in.
[Unit]
After=cloud-final.service
