# Drop-in for ssf-seed.service under Firecracker (make-base.sh puts the
# files in this directory into the image, and provision.sh installs each as
# /etc/systemd/system/<unit>.d/firecracker.conf). The seed writes the
# host's key into authorized_keys, so it runs before sshd: here there is no
# cloud-init stage to wait for, so ordering the seed before sshd.service
# makes no cycle, and the host's first ssh attempt already finds the key.
[Unit]
Before=sshd.service
